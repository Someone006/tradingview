name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The suite runs entirely offline against fixtures and the deterministic
      # simulation engine, so no secrets or network access are required.
      - run: npm test
      - run: npm ci --omit=optional || npm install
      - run: npm run typecheck
